<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #f4f4f9;
      color: #333;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #444;
    }

    .task-input-container {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .task-input-container input,
    .task-input-container select,
    .task-input-container button {
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 1rem;
      width: 100%;
    }

    .task-input-container button {
      background: #6a11cb;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .task-input-container button:hover {
      background: #2575fc;
    }

    .week-view {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .day-column {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .day-column h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #444;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-column ul {
      list-style: none;
      padding: 0;
    }

    .day-column li {
      background: #f9f9f9;
      padding: 10px;
      margin-bottom: 5px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .day-column li button {
      background: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .day-column li button:hover {
      background: #ff3b2f;
    }

    .clear-button {
      background: #ff6f61;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .clear-button:hover {
      background: #ff3b2f;
    }
  </style>
</head>
<body>
  <h1>Your Weekly To-Do List</h1>

  <!-- Task Input Section -->
  <div class="task-input-container">
    <input type="text" id="taskInput" placeholder="Enter a new task">
    <input type="time" id="taskTime" step="300">
    <select id="daySelect">
      <option value="Sunday">Sunday</option>
      <option value="Monday">Monday</option>
      <option value="Tuesday">Tuesday</option>
      <option value="Wednesday">Wednesday</option>
      <option value="Thursday">Thursday</option>
      <option value="Friday">Friday</option>
      <option value="Saturday">Saturday</option>
    </select>
    <button id="addTaskButton">Add Task</button>
  </div>

  <!-- Week View -->
  <div class="week-view">
    <div class="day-column" id="Sunday">
      <h2>Sunday <button class="clear-button" onclick="clearTasks('Sunday')">Clear All</button></h2>
      <ul></ul>
    </div>
    <div class="day-column" id="Monday">
      <h2>Monday <button class="clear-button" onclick="clearTasks('Monday')">Clear All</button></h2>
      <ul></ul>
    </div>
    <div class="day-column" id="Tuesday">
      <h2>Tuesday <button class="clear-button" onclick="clearTasks('Tuesday')">Clear All</button></h2>
      <ul></ul>
    </div>
    <div class="day-column" id="Wednesday">
      <h2>Wednesday <button class="clear-button" onclick="clearTasks('Wednesday')">Clear All</button></h2>
      <ul></ul>
    </div>
    <div class="day-column" id="Thursday">
      <h2>Thursday <button class="clear-button" onclick="clearTasks('Thursday')">Clear All</button></h2>
      <ul></ul>
    </div>
    <div class="day-column" id="Friday">
      <h2>Friday <button class="clear-button" onclick="clearTasks('Friday')">Clear All</button></h2>
      <ul></ul>
    </div>
    <div class="day-column" id="Saturday">
      <h2>Saturday <button class="clear-button" onclick="clearTasks('Saturday')">Clear All</button></h2>
      <ul></ul>
    </div>
  </div>

  <script>
    // Get references to input fields and button
    const taskInput = document.getElementById('taskInput');
    const taskTime = document.getElementById('taskTime');
    const daySelect = document.getElementById('daySelect');
    const addTaskButton = document.getElementById('addTaskButton');

    // Add task functionality
    addTaskButton.addEventListener('click', () => {
      const taskText = taskInput.value.trim();
      const timeValue = taskTime.value;
      const selectedDay = daySelect.value;

      if (taskText !== '' && timeValue !== '') {
        const dayColumn = document.getElementById(selectedDay).querySelector('ul');

        // Create a new task item
        const listItem = document.createElement('li');
        listItem.innerHTML = `
          ${timeValue} - ${taskText}
          <button onclick="editTask(this)">Edit</button>
          <button onclick="deleteTask(this)">Delete</button>
        `;

        dayColumn.appendChild(listItem);

        // Clear input fields
        taskInput.value = '';
        taskTime.value = '';
      }
    });

    // Edit task functionality
    function editTask(button) {
      const listItem = button.parentElement;
      const taskDetails = listItem.textContent.split(' - ')[1].split('Edit')[0].trim();
      const timeDetails = listItem.textContent.split(' - ')[0].trim();

      taskInput.value = taskDetails;
      taskTime.value = timeDetails;

      listItem.remove();
    }

    // Delete task functionality
    function deleteTask(button) {
      if (confirm('Are you sure you want to delete this task?')) {
        const listItem = button.parentElement;
        listItem.remove();
      }
    }

    // Clear all tasks for a specific day
    function clearTasks(day) {
      if (confirm(`Are you sure you want to clear all tasks for ${day}?`)) {
        const dayColumn = document.getElementById(day).querySelector('ul');
        dayColumn.innerHTML = '';
      }
    }
  </script>
</body>
</html>
